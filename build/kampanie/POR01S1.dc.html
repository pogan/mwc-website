<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500&family=Parisienne&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .slide {
      position: relative; width: 1080px; height: 1080px; overflow: hidden;
      background: radial-gradient(120% 120% at 30% 20%, #7a5744 0%, #6a4938 100%);
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-variant-numeric: lining-nums;
      color: #f6efe5;
    }
    .slide .bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0.14;
      mix-blend-mode: soft-light; filter: grayscale(0.2);
    }
    .inner {
      position: absolute; inset: 0; padding: 116px 108px 92px;
      display: flex; flex-direction: column;
    }
    .foot {
      position: absolute; left: 0; right: 0; bottom: 60px; text-align: center;
      font-family: 'Jost', system-ui, sans-serif; font-weight: 300;
      font-size: 20px; letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(246,239,229,0.62);
    }
    .arrow {
      position: absolute; right: 104px; bottom: 150px; width: 132px; height: auto;
      opacity: 0.62;
    }
    .lead { display: block; font-weight: 600; margin-bottom: 22px; text-wrap: balance; }
    .lead.quote { font-size: 42px; }
    a { color: #f3e6d5; } a:hover { color: #f3e6d5; }
  </style>
</helmet>
<div class="slide">
  <img class="bg" src="bg-rustic.jpg" alt="">
  <div class="inner">
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
      <h1 style="margin:0; font-weight:600; font-size:80px; line-height:1.14; letter-spacing:0.3px; text-wrap:balance;">Kiedy wziąć<br>ślub humanistyczny?</h1>
      <div style="margin-top:36px; font-size:35px; line-height:1.4; color:#e9dccb;">Ceremonia w cztery pory roku.</div>
    </div>
  </div>
  <svg class="arrow" viewBox="0 0 240 140" fill="none" stroke="rgba(246,239,229,0.72)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 40 C 68 6, 126 8, 150 58 C 160 80, 142 106, 120 95 C 104 87, 110 60, 138 64 C 178 70, 208 92, 226 74" />
      <path d="M226 74 l -24 -2 M226 74 l -9 20" />
    </svg>
  <div class="foot">marczykowska.com</div>
</div>
</x-dc>
</body>
</html>
