<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500&family=Parisienne&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .slide {
      position: relative; width: 1080px; height: 1080px; overflow: hidden;
      background: radial-gradient(120% 120% at 30% 20%, #efe6d5 0%, #e4d7c1 100%);
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      color: #453a2b;
    }
    .slide .bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0.13;
      mix-blend-mode: multiply; filter: grayscale(0.2);
    }
    .inner {
      position: absolute; inset: 0; padding: 118px 112px 96px;
      display: flex; flex-direction: column;
    }
    .kicker {
      font-family: 'Jost', system-ui, sans-serif; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.34em; font-size: 21px;
      color: #9a7b4f;
    }
    .foot {
      position: absolute; left: 0; right: 0; bottom: 60px; text-align: center;
      font-style: italic; font-size: 24px; letter-spacing: 0.06em;
      color: #93856a;
    }
    .arrow {
      position: absolute; right: 104px; bottom: 150px; width: 132px; height: auto;
      opacity: 0.62;
    }
    a { color: #8a6a3f; } a:hover { color: #8a6a3f; }
  </style>
</helmet>
<div class="slide">
  <img class="bg" src="bg-family.jpg" alt="">
  <div class="inner">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px;">
      <div style="font-style:italic; font-size:40px; color:#776a53;">Masz pytania?</div>
      <h2 style="margin:0 0 26px; font-weight:600; font-size:56px; line-height:1.2;">Napisz do mnie<br>lub zadzwoń</h2>
      <div style="font-family:'Jost',system-ui,sans-serif; font-weight:300; font-size:34px; letter-spacing:0.14em; color:#453a2b;">+48 510 769 900</div>
      <div style="font-family:'Parisienne',cursive; font-size:62px; line-height:1; margin-top:34px; color:#8a6a3f;">Milena Marczykowska</div>
      <div style="font-family:'Jost',system-ui,sans-serif; font-weight:300; font-size:20px; letter-spacing:0.3em; text-transform:uppercase; color:#776a53; margin-top:14px;">marczykowska.com</div>
    </div>
  </div>
  
  
</div>
</x-dc>
</body>
</html>
