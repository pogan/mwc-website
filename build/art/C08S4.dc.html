<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500&family=Parisienne&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .slide {
      position: relative; width: 1080px; height: 1080px; overflow: hidden;
      background: radial-gradient(120% 120% at 30% 20%, #7a5744 0%, #6a4938 100%);
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      color: #f6efe5;
    }
    .slide .bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0.14;
      mix-blend-mode: soft-light; filter: grayscale(0.2);
    }
    .frame {
      position: absolute; inset: 54px; border: 1px solid rgba(246,239,229,0.72);
      opacity: 0.35; pointer-events: none;
    }
    .inner {
      position: absolute; inset: 0; padding: 118px 112px 96px;
      display: flex; flex-direction: column;
    }
    .kicker {
      font-family: 'Jost', system-ui, sans-serif; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.34em; font-size: 21px;
      color: #ecceac;
    }
    .foot {
      position: absolute; left: 0; right: 0; bottom: 60px; text-align: center;
      font-style: italic; font-size: 24px; letter-spacing: 0.06em;
      color: rgba(246,239,229,0.62);
    }
    .arrow {
      position: absolute; right: 104px; bottom: 150px; width: 132px; height: auto;
      opacity: 0.62;
    }
    a { color: #f3e6d5; } a:hover { color: #f3e6d5; }
  </style>
</helmet>
<div class="slide">
  <img class="bg" src="bg.jpg" alt="">
  <div class="frame"></div>
  <div class="inner">
    <div style="text-align:center; font-style:italic; font-size:30px; line-height:1.4; color:#e9dccb; max-width:640px; margin:0 auto;">Jak wygląda oprawa<br>muzyczna i nagłośnienie<br>ceremonii?</div>
    <div style="flex:1; display:flex; align-items:center; justify-content:center;">
      <p style="margin:0; text-align:center; font-weight:500; font-size:46px; line-height:1.4; letter-spacing:0.2px; max-width:820px; text-wrap:pretty;">Zwykle korzystam z nagłośnienia DJ-a lub obiektu, by nie generować dodatkowych kosztów. Przed ceremonią zawsze robię próbę mikrofonu.</p>
    </div>
    <div style="display:flex; gap:14px; justify-content:center;">
      <span style="width:10px; height:10px; border-radius:6px; background:rgba(246,239,229,0.62); opacity:0.5; transition:all .2s;"></span>
      <span style="width:10px; height:10px; border-radius:6px; background:rgba(246,239,229,0.62); opacity:0.5; transition:all .2s;"></span>
      <span style="width:10px; height:10px; border-radius:6px; background:rgba(246,239,229,0.62); opacity:0.5; transition:all .2s;"></span>
      <span style="width:34px; height:10px; border-radius:6px; background:#ecceac; opacity:1; transition:all .2s;"></span>
    </div>
  </div>
  <svg class="arrow" viewBox="0 0 240 140" fill="none" stroke="rgba(246,239,229,0.72)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 40 C 68 6, 126 8, 150 58 C 160 80, 142 106, 120 95 C 104 87, 110 60, 138 64 C 178 70, 208 92, 226 74" />
      <path d="M226 74 l -24 -2 M226 74 l -9 20" />
    </svg>
  <div class="foot">@milena_wolak_ceremonie</div>
</div>
</x-dc>
</body>
</html>
