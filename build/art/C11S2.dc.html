<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500&family=Parisienne&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .slide {
      position: relative; width: 1080px; height: 1080px; overflow: hidden;
      background: radial-gradient(120% 120% at 30% 20%, #f2e8db 0%, #ece0d0 100%);
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      color: #4a3b30;
    }
    .slide .bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0.12;
      mix-blend-mode: multiply; filter: grayscale(0.2);
    }
    .inner {
      position: absolute; inset: 0; padding: 118px 112px 96px;
      display: flex; flex-direction: column;
    }
    .kicker {
      font-family: 'Jost', system-ui, sans-serif; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.34em; font-size: 21px;
      color: #9c6f4f;
    }
    .foot {
      position: absolute; left: 0; right: 0; bottom: 60px; text-align: center;
      font-style: italic; font-size: 24px; letter-spacing: 0.06em;
      color: #95836f;
    }
    .arrow {
      position: absolute; right: 104px; bottom: 150px; width: 132px; height: auto;
      opacity: 0.62;
    }
    a { color: #8a5a44; } a:hover { color: #8a5a44; }
  </style>
</helmet>
<div class="slide">
  <img class="bg" src="bg.jpg" alt="">
  <div class="inner">
    <div style="text-align:center; font-style:italic; font-size:30px; line-height:1.4; color:#7a6552; max-width:640px; margin:0 auto;">Co, jeśli zachorujesz<br>albo zdarzy się<br>coś nagłego?</div>
    <div style="flex:1; display:flex; align-items:center; justify-content:center;">
      <p style="margin:0; text-align:center; font-weight:500; font-size:47px; line-height:1.42; letter-spacing:0.2px; max-width:830px; text-wrap:pretty;">Wasze bezpieczeństwo jest dla mnie priorytetem.</p>
    </div>
    <div style="height:26px;"></div>
  </div>
  <svg class="arrow" viewBox="0 0 240 140" fill="none" stroke="#b58c68" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 40 C 68 6, 126 8, 150 58 C 160 80, 142 106, 120 95 C 104 87, 110 60, 138 64 C 178 70, 208 92, 226 74" />
      <path d="M226 74 l -24 -2 M226 74 l -9 20" />
    </svg>
  <div class="foot">@milena_wolak_ceremonie</div>
</div>
</x-dc>
</body>
</html>
